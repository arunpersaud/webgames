[project]
name = "webgames"
version = "0.2.0"
description = "Games to play with friends over a video call"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
